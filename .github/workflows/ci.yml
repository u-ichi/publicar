name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare wrangler config for tests
        run: |
          [ -f wrangler.toml ] || cp wrangler.toml.example wrangler.toml
          [ -f .dev.vars ] || cp .dev.vars.example .dev.vars

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  dispatch-deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PUBLICAR_DISPATCH_ENABLED == 'true'
    env:
      PRIVATE_REPO: ${{ vars.PRIVATE_DEPLOY_REPOSITORY }}
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_DISPATCH_TOKEN }}

    steps:
      - name: Start private deploy workflow
        run: |
          test -n "$PRIVATE_REPO"
          test -n "$GH_TOKEN"
          gh api --method POST "repos/$PRIVATE_REPO/actions/workflows/deploy-from-public.yml/dispatches" \
            -f ref=main \
            -f "inputs[sha]=$GITHUB_SHA" \
            -f "inputs[source_run_id]=$GITHUB_RUN_ID" \
            -f "inputs[source_run_attempt]=$GITHUB_RUN_ATTEMPT"
