name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  dispatch-deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PUBLICAR_DISPATCH_ENABLED == 'true'
    env:
      PRIVATE_REPO: ${{ vars.PRIVATE_DEPLOY_REPOSITORY }}
      DISPATCH_EVENT_TYPE: deploy-from-public
      DISPATCH_TOKEN: ${{ secrets.PRIVATE_REPO_DISPATCH_TOKEN }}

    steps:
      - name: Dispatch private deploy workflow
        run: |
          test -n "${PRIVATE_REPO}"
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PRIVATE_REPO}/dispatches" \
            -d @- <<JSON
          {
            "event_type": "${DISPATCH_EVENT_TYPE}",
            "client_payload": {
              "sha": "${GITHUB_SHA}",
              "source_repository": "${GITHUB_REPOSITORY}",
              "source_run_id": "${GITHUB_RUN_ID}",
              "source_run_attempt": "${GITHUB_RUN_ATTEMPT}"
            }
          }
          JSON
