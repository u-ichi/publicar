services:
  app:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - .dev.vars
    environment:
      NODE_ENV: development
      WRANGLER_LOG_PATH: /app/tmp/wrangler-docker.log
      XDG_CACHE_HOME: /app/tmp/tool-cache
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - wrangler_state:/app/.wrangler
    command: npm run dev -- --ip 0.0.0.0 --port 8787

volumes:
  node_modules:
  wrangler_state:
